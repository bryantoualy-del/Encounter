name: Table Libre V2.4 — Tours synchronisés

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  session:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'fix/v24-lot1-tours'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Checkout coordinated turn branches
        run: |
          for repo in RPG-Connect Kobe Brackmard Samoth Nans Rufus Zephyr Kentaro; do
            git clone --depth=1 --branch fix/v24-lot1-tours "https://github.com/bryantoualy-del/$repo.git" "../$repo"
          done
      - run: npm ci
        working-directory: ../RPG-Connect
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: node audit/v24-turns-browser.mjs
        env:
          RPG_BROWSER: ${{ matrix.browser }}

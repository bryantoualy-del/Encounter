name: Encounter CI

on:
  push:
    branches: [main, audit/recovery-2026-10-04]
  pull_request:

concurrency:
  group: encounter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Checkout Companion repos
        run: npm run audit:checkout
      - name: Protocol, MJ and multi-target tests
        run: npm test
      - name: Companion bridge tests
        run: npm run test:companions
      - name: Creature icon tests
        run: npm run test:icons
      - name: Install real Chromium
        run: npx playwright install --with-deps chromium
      - name: Isolated WebSocket and browser E2E
        run: npm run test:e2e
      - name: Brack combat integration E2E
        run: npm run test:brack:browser
      - name: Rufus combat integration E2E
        run: npm run test:rufus:browser
      - name: E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-rpg-e2e
          path: |
            audit/results/
            audit/brack-results/
            audit/rufus-results/


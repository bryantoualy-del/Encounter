name: Encounter CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Protocol and MJ tests
        run: npm test
      - name: Companion bridge tests
        run: npm run test:companions
      - name: Creature icon tests
        run: npm run test:icons

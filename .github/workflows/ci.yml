name: Encounter CI

on:
  push:
    branches: [main, audit/recovery-2026-10-04]
  pull_request:

concurrency:
  group: encounter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Checkout Companion repos
        run: npm run audit:checkout
      - name: Install canonical RPG Connect server
        run: npm ci
        working-directory: ../RPG-Connect
      - name: Protocol, MJ and multi-target tests
        run: npm test
      - name: Encounter V1.3 result presentation tests
        run: npm run test:v13
      - name: Encounter UX layout regression tests
        run: node --test audit/encounter-ux-layout.test.cjs
      - name: Companion bridge tests
        run: npm run test:companions
      - name: Creature icon tests
        run: npm run test:icons
  guided-browser:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [test:e2e, test:brack:browser, test:rufus:browser]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit:checkout
      - run: npm ci
        working-directory: ../RPG-Connect
      - run: npx playwright install --with-deps chromium
      - name: Clear previous evidence
        run: rm -rf audit/results audit/brack-results audit/rufus-results
      - run: npm run ${{ matrix.suite }}
      - name: E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guided-${{ strategy.job-index }}
          path: |
            audit/results/
            audit/brack-results/
            audit/rufus-results/

  v13-lot2-browser:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Checkout Companion repos
        run: npm run audit:checkout
      - name: Install canonical RPG Connect server
        run: npm ci
        working-directory: ../RPG-Connect
      - name: Browser installation
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Targeted Lot 2 browser validation
        run: npm run test:v13:browser
        env:
          V13_BROWSER: ${{ matrix.browser }}
      - name: Browser screenshots and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v13-lot2-${{ matrix.browser }}
          path: audit/v13-lot2-evidence/
          if-no-files-found: warn

  v13-lot3-browser:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Encounter Lot 3 controls, icons, and roll engines
        run: npm run test:v13:lot3:browser
        env:
          V13_BROWSER: ${{ matrix.browser }}
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v13-lot3-${{ matrix.browser }}
          path: audit/v13-lot3-evidence/
          if-no-files-found: warn

  v13-lot4-browser:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Lot 4 boss steppers, rounding, persistence, regressions
        run: npm run test:v13:lot4:browser
        env:
          V13_BROWSER: ${{ matrix.browser }}
      - name: Lot 4 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v13-lot4-${{ matrix.browser }}
          path: audit/v13-lot4-evidence/
          if-no-files-found: warn

  companion-result-focus-browser:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit:checkout
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Seven Companion result cards, 13 typed damage colors and duplicate-free ribbon
        run: npm run test:result-focus:browser
        env:
          RESULT_BROWSER: ${{ matrix.browser }}
      - name: Result focus audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: companion-result-focus-${{ matrix.browser }}
          path: audit/result-focus-evidence/
          if-no-files-found: warn

name: Encounter CI

on:
  push:
    branches: [main, audit/recovery-2026-10-04]
  pull_request:

concurrency:
  group: encounter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Checkout Companion repos
        run: npm run audit:checkout
      - name: Install canonical RPG Connect server
        run: npm ci
        working-directory: ../RPG-Connect
      - name: Protocol, MJ and multi-target tests
        run: npm test
      - name: Companion bridge tests
        run: npm run test:companions
      - name: Creature icon tests
        run: npm run test:icons
  guided-browser:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [test:e2e, test:brack:browser, test:rufus:browser]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit:checkout
      - run: npm ci
        working-directory: ../RPG-Connect
      - run: npx playwright install --with-deps chromium
      - run: npm run ${{ matrix.suite }}
      - name: E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guided-${{ strategy.job-index }}
          path: |
            audit/results/
            audit/brack-results/
            audit/rufus-results/

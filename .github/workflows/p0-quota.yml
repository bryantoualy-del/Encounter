name: Encounter P0 quota safety
on:
  pull_request:
    paths:
      - 'app.js'
      - 'encounter-persistence.js'
      - 'index.html'
      - 'service-worker.js'
      - 'audit/p0-quota-actions-browser.mjs'
      - 'package.json'
      - '.github/workflows/p0-quota.yml'
  workflow_dispatch:

jobs:
  quota-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Run Chromium and WebKit quota recovery tests
        run: npm run test:p0:quota
